[project]
name = "bls-ai-gateway"
version = "0.2.0"
description = "HTTP gateway that routes LLM completion requests across multiple providers."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real upstream providers (e.g. OpenAI). Skipped by default; opt in with `pytest -m live`. Requires OPENAI_API_KEY in .env.",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
