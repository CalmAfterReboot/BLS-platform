---
# Overridable defaults — values here can be overridden by group_vars/host_vars
ssh_port: 22
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5

packages_remove:
  - telnet
  - rsh-client
  - rsh-redone-client

packages_install:
  - fail2ban
  - ufw
  - curl
  - wget
  - unzip

ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 3
ssh_allow_agent_forwarding: "no"
ssh_allow_tcp_forwarding: "no"

ssh_pubkey_authentication: "yes"
ssh_allow_users: "ansible"
ssh_login_grace_time: 30
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2

ufw_allowed_ports:
  - { port: "22", proto: "tcp", comment: "SSH" }
  - { port: "6443", proto: "tcp", comment: "k3s API server" }
  - { port: "2379", proto: "tcp", comment: "etcd client" }
  - { port: "2380", proto: "tcp", comment: "etcd peer" }
  - { port: "10250", proto: "tcp", comment: "kubelet" }
  - { port: "8472", proto: "udp", comment: "flannel VXLAN" }
  - { port: "51820", proto: "udp", comment: "WireGuard" }

sysctl_settings:
  net.ipv4.ip_forward: "1"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.tcp_syncookies: "1"
  kernel.dmesg_restrict: "1"
  kernel.kptr_restrict: "2"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"

limits_settings:
  - { domain: "*", limit_type: "soft", limit_item: "nofile", value: "65536" }
  - { domain: "*", limit_type: "hard", limit_item: "nofile", value: "65536" }
  - { domain: "*", limit_type: "soft", limit_item: "nproc", value: "65536" }
  - { domain: "*", limit_type: "hard", limit_item: "nproc", value: "65536" }

## fail2ban CIDR allowlist.
## Default is loopback only. Override in `group_vars/all.local.yml`
## (gitignored) with the trusted subnets for your environment, e.g.:
##   fail2ban_ignoreip: "127.0.0.1/8 <homelab-subnet-cidr> <ollama-host-subnet-cidr>"
fail2ban_ignoreip: "127.0.0.1/8"

auditd_rules_dir: "/etc/audit/rules.d"

ntp_servers:
  - "0.uk.pool.ntp.org"
  - "1.uk.pool.ntp.org"
  - "2.uk.pool.ntp.org"
  - "3.uk.pool.ntp.org"
