---
- name: Set UFW default input policy to deny
  community.general.ufw:
    default: deny
    direction: incoming
  notify: reload ufw

- name: Set UFW default output policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing
  notify: reload ufw

- name: Set UFW default forward policy to deny
  community.general.ufw:
    default: deny
    direction: routed
  notify: reload ufw

- name: Allow defined ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_allowed_ports }}"
  notify: reload ufw

- name: Enable UFW
  community.general.ufw:
    state: enabled
