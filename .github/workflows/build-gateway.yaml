name: Build LLM Gateway

on:
  push:
    paths:
      - 'k8s/workloads/llm-gateway/app/**'
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: k8s/workloads/llm-gateway/app
          push: true
          tags: |
            ghcr.io/calmafterreboot/bls-llm-gateway:latest
            ghcr.io/calmafterreboot/bls-llm-gateway:${{ github.sha }}
