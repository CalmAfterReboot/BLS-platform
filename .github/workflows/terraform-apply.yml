name: Terraform Apply

on:
  workflow_run:
    workflows: ["Terraform Plan"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY to confirm manual apply"
        required: true

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'APPLY')

    environment: production

    defaults:
      run:
        working-directory: projects/01-landing-zone

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION:    true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.workflow_run.head_sha || github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
        id: download_plan

      - name: Terraform Plan (fallback if no artifact)
        if: steps.download_plan.outcome == 'failure'
        run: |
          echo "::warning::No plan artifact found — generating fresh plan."
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          # Artifact is downloaded to the runner root, not the working directory.
          # Find it and copy it into place before applying.
          PLAN_FILE=$(find $GITHUB_WORKSPACE -name "tfplan" | head -1)
          if [ -n "$PLAN_FILE" ]; then
            echo "Found plan at $PLAN_FILE"
            cp "$PLAN_FILE" tfplan
            terraform apply -auto-approve tfplan
          else
            echo "::error::No plan file found. Cannot apply."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Apply Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
