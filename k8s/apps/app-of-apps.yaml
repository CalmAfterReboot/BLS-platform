apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bls-workloads
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/CalmAfterReboot/BLS-platform
          revision: HEAD
          directories:
          - path: k8s/workloads/*
          # Exclude: gatekeeper-constraints is deployed via a standalone
          # ArgoCD Application at k8s/apps/gatekeeper-constraints.yaml
          # so the operator can sync-wave it AFTER the gatekeeper
          # webhook is Healthy. The matrix would generate a duplicate
          # that races the webhook readiness.
          - path: k8s/workloads/gatekeeper-constraints
            exclude: true
      - clusters: {}
  template:
    metadata:
      name: '{{path.basename}}-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/CalmAfterReboot/BLS-platform
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
