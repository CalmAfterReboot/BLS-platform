apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bls-workloads
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/CalmAfterReboot/BLS-platform
          revision: HEAD
          directories:
          - path: k8s/workloads/*
          # Standalone-managed workloads are excluded from the matrix
          # ApplicationSet — each has a dedicated Application in k8s/apps/
          # with sync behaviour the matrix can't express. This block is
          # kept IDENTICAL across the p6 feature branches so the branches
          # merge without conflicting on this file; excluding a path that
          # does not yet exist on a given branch is harmless.
          #   cloudflared            -> manual sync gate (prune+selfHeal off), ADR-012
          #   argocd-config          -> kubectl-patch-only, NOT applied as manifests, ADR-012
          #   otel-collector         -> Helm dependency build, ADR-013
          #   gatekeeper-constraints -> sync-wave after gatekeeper webhook Healthy, ADR-016
          - path: k8s/workloads/cloudflared
            exclude: true
          - path: k8s/workloads/argocd-config
            exclude: true
          - path: k8s/workloads/otel-collector
            exclude: true
          - path: k8s/workloads/gatekeeper-constraints
            exclude: true
      - clusters: {}
  template:
    metadata:
      name: '{{path.basename}}-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/CalmAfterReboot/BLS-platform
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
