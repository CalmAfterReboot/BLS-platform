# Standalone ArgoCD Application for the Sealed Secrets controller.
# Deployed to a dedicated namespace so the controller lifecycle is
# independent of kube-system. kubeseal must target this namespace:
#   kubeseal --controller-namespace sealed-secrets --controller-name sealed-secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "2.18.5"
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
