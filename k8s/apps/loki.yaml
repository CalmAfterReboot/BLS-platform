# Standalone ArgoCD Application for Loki — multi-source pattern matching
# k8s/apps/monitoring.yaml (chart from upstream + values from this repo).
# Loki is deployed in `observability` namespace.
#
# Repo note: the OSS Loki chart moved from grafana/helm-charts to
# grafana-community/helm-charts in 2026; we follow it to the maintained
# successor (chart 17.x, Loki appVersion 3.7.x). Values render-verified
# against the existing 05-observability-security/values/loki.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: bls-platform
    app.kubernetes.io/component: logs
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: "17.1.5"
      helm:
        releaseName: loki
        valueFiles:
          - $values/05-observability-security/values/loki.yaml
    - repoURL: https://github.com/CalmAfterReboot/BLS-platform
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
