# Placeholder SealedSecret for cloudflared tunnel credentials.
#
# This file ships intentionally empty. The operator generates the
# real SealedSecret post-merge using `kubeseal` against the
# credentials.json that `terraform apply` produces. See
# docs/runbooks/cloudflared-tunnel.md step 2 for the exact recipe.
#
# Until the encryptedData below is filled in and committed in a
# follow-up PR, the cloudflared Deployment will fail to start
# (no credentials = no tunnel). This is the design intent: the
# SealedSecret commit IS the production-go-live moment.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
spec:
  encryptedData:
    # SealedSecret — encrypted by the in-cluster sealed-secrets controller's
    # public key; only that controller can decrypt it. Safe to commit.
    # Sealed 2026-05-30 from `terraform output -raw tunnel_credentials_json`.
    credentials.json:   # pragma: allowlist secret
  template:
    metadata:
      name: cloudflared-credentials
      namespace: {{ .Values.namespace }}
    type: Opaque
