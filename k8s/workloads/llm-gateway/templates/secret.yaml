# llm-gateway-secrets is committed encrypted. It is sealed with --scope=strict
# bound to namespace=llm-gateway and name=llm-gateway-secrets, so it cannot be
# unsealed in any other namespace or under a different name. See SECURITY.md
# for the re-sealing workflow and the multi-cluster note (bls-aks-demo needs
# its own sealed manifest sealed against its own controller public key).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: llm-gateway-secrets
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    bls-api-keys: 
    litellm-master-key: 
    ollama-endpoint: 
  template:
    metadata:
      name: llm-gateway-secrets
      namespace: {{ .Values.namespace }}
    type: Opaque
