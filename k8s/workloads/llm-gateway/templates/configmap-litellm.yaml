apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    model_list:
      - model_name: local/llama3.2
        litellm_params:
          model: ollama/llama3.2
          api_base: os.environ/OLLAMA_ENDPOINT
      - model_name: local/mistral
        litellm_params:
          model: ollama/mistral
          api_base: os.environ/OLLAMA_ENDPOINT
      - model_name: local/deepseek-r1
        litellm_params:
          model: ollama/deepseek-r1:7b
          api_base: os.environ/OLLAMA_ENDPOINT
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      timeout: 120
    litellm_settings:
      drop_params: true
      request_timeout: 120
    general_settings:
      disable_spend_logs: true
      disable_reset_budget: true
    cache:
      type: redis
      host: redis-service
      port: 6379
      ttl: 3600
