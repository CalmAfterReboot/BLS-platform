apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    model_list:
      - model_name: local/llama3.2
        litellm_params:
          model: ollama/llama3.2
          api_base: os.environ/OLLAMA_ENDPOINT
      - model_name: local/mistral
        litellm_params:
          model: ollama/mistral
          api_base: os.environ/OLLAMA_ENDPOINT
      - model_name: local/deepseek-r1
        litellm_params:
          model: ollama/deepseek-r1:7b
          api_base: os.environ/OLLAMA_ENDPOINT
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      timeout: 120
    litellm_settings:
      drop_params: true
      request_timeout: 120
      # OTel callback emits per-request spans + metrics for every
      # provider call LiteLLM makes. Exports via OTLP/gRPC to the
      # endpoint in OTEL_EXPORTER_OTLP_ENDPOINT (default points at
      # the in-cluster otel-collector — see ADR-013). Service name
      # comes from OTEL_SERVICE_NAME (default bls-llm-gateway-litellm
      # to distinguish from the FastAPI edge layer's traces).
      # GenAI semantic conventions (gen_ai.* attributes) are emitted
      # automatically by LiteLLM v1.40+ when the otel callback is
      # active; see ADR-014 for the adoption posture and known gaps.
      callbacks: ["otel"]
    general_settings:
      disable_spend_logs: true
      disable_reset_budget: true
    cache:
      type: redis
      host: redis-service
      port: 6379
      ttl: 3600
