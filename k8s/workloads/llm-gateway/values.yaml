namespace: llm-gateway

gateway:
  image: ghcr.io/calmafterreboot/bls-llm-gateway:latest
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

litellm:
  image: ghcr.io/berriai/litellm:main-latest
  replicas: 1
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: traefik
  host: llm-gateway.local
  tls: false
