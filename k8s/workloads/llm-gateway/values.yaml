namespace: llm-gateway

gateway:
  # Pinned to digest per ADR-015. The :latest tag is mutable and
  # the build-gateway.yaml workflow overwrites it on every merge to
  # main; pinning prevents an ArgoCD self-heal from silently
  # rolling forward to an unreviewed image.
  # Resolved 2026-05-28 from tag :latest via:
  #   docker buildx imagetools inspect ghcr.io/calmafterreboot/bls-llm-gateway:latest
  image: ghcr.io/calmafterreboot/bls-llm-gateway@sha256:c67e10e8b93d69f616d05380151ffc1a5a95a47992c567f3a2030fafc03b0513
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

litellm:
  # Pinned to multi-arch index digest per ADR-015. The :main-latest
  # tag is overwritten on every push to LiteLLM's main branch.
  # Resolved 2026-05-28 from tag :main-latest via:
  #   docker buildx imagetools inspect ghcr.io/berriai/litellm:main-latest
  image: ghcr.io/berriai/litellm@sha256:7c311546c25e7bb6e8cafede9fcd3d0d622ac636b5c9418befaa32e85dfb0186
  replicas: 1
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

redis:
  # Pinned to multi-arch index digest per ADR-015. Docker Hub's
  # :7-alpine tag floats forward inside the 7.x line.
  # Resolved 2026-05-28 from tag :7-alpine via:
  #   docker buildx imagetools inspect redis:7-alpine
  image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: traefik
  host: llm-gateway.local
  tls: false

networkPolicies:
  # Set to false to deploy the chart in a cluster without NetworkPolicy
  # enforcement (e.g., a cluster running stock Flannel with no policy
  # controller). When false, no NetworkPolicy resources are rendered and
  # all in-namespace traffic is permitted. See ADR-009 for scope.
  enabled: true
  # Cluster CIDRs are used in the LiteLLM egress allow-list to exclude
  # in-cluster destinations from the "external" ipBlock. Defaults below
  # are k3s defaults — override per-cluster (e.g., for an Azure CNI
  # AKS cluster) via an ApplicationSet values overlay.
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16

prometheusRules:
  # Set to false if deploying the chart to a cluster where the
  # prometheus-operator CRDs are not installed (the PrometheusRule
  # render would fail otherwise). Three workload rules ship by default:
  # LLMGatewayDown, LLMGatewayHighErrorRate, LLMGatewayHighLatency.
  # Per ADR-010, the rules fire to the Prometheus UI only — Alertmanager
  # is disabled in this deployment, there is no external paging.
  enabled: true
