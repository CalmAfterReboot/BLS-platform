# Loki datasource for Grafana — picked up by the kube-prometheus-stack
# Grafana sidecar (which watches for ConfigMaps labelled grafana_datasource).
# Datasource UID is hardcoded so the Tempo datasource can target it via
# tracesToLogsV2 (trace → log pivot in the Explore view).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false
        jsonData:
          maxLines: 1000
          # Derived field — when a log line contains `trace_id=<hex>`,
          # render it as a clickable link to the Tempo datasource. This
          # is the log → trace pivot half of the tracing/logging loop.
          derivedFields:
            - name: TraceID
              matcherRegex: 'trace[_ ]?id[=:]\s*(\w+)'
              url: '$${__value.raw}'
              datasourceUid: tempo
