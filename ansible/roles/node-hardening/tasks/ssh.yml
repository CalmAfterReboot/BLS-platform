---
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ sshd_config_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
    backup: true
  notify: restart sshd

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Disable SSH protocol 1 via moduli (remove small moduli)
  ansible.builtin.shell:
    cmd: awk '$5 >= 3071' /etc/ssh/moduli > /tmp/moduli.safe && mv /tmp/moduli.safe /etc/ssh/moduli
    creates: /etc/ssh/.moduli_hardened
  register: moduli_result
  changed_when: moduli_result.rc == 0

- name: Mark moduli as hardened
  ansible.builtin.file:
    path: /etc/ssh/.moduli_hardened
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: moduli_result.changed
