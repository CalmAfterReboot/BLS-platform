# grafana/loki values — SingleBinary deployment mode for portfolio scale.
# Chart: grafana/loki @ 6.x (single-binary supported since 6.0).
# Storage: local filesystem on a 10 GiB PVC. Retention: 14 days.
# Documented portfolio-scope limitation: this won't scale beyond a
# single-node ingest rate; production would use the chart's
# SimpleScalable or Distributed modes with object storage. See
# ADR-013 §"Storage trade-offs".

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 336h     # 14 days per spec
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Disable distributed-mode component pools — SingleBinary subsumes them.
backend:        { replicas: 0 }
read:           { replicas: 0 }
write:          { replicas: 0 }
ingester:       { replicas: 0 }
querier:        { replicas: 0 }
queryFrontend:  { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor:    { replicas: 0 }
compactor:      { replicas: 0 }
indexGateway:   { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway:   { replicas: 0 }

# Filesystem storage = no object store, no gateway, no canaries.
minio:    { enabled: false }
gateway:  { enabled: false }
test:     { enabled: false }

monitoring:
  selfMonitoring: { enabled: false }
  lokiCanary:     { enabled: false }
  serviceMonitor:
    enabled: true
