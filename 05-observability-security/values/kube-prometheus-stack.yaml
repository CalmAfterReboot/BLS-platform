# kube-prometheus-stack homelab values
# chart: 84.5.0 / appVersion: v0.90.1
# Referenced by: k8s/apps/monitoring.yaml (multi-source via $values ref)

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: "5GB"
    # Accept remote-write from the otel-collector (see ADR-013) so OTLP
    # metrics from the LLM gateway land in the same Prometheus that
    # scrapes everything else. Endpoint: /api/v1/write. No auth — the
    # NetworkPolicy posture (ADR-009) is what scopes the receiver.
    enableRemoteWriteReceiver: true
    # Watch ServiceMonitors across all namespaces — required for llm-gateway scraping.
    # serviceMonitorSelectorNilUsesHelmValues must be false or Prometheus ignores the
    # empty selector and defaults to matchLabels: release: kube-prometheus-stack.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelector: {}
    ruleNamespaceSelector: {}
    storageSpec: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials  # pragma: allowlist secret
    userKey: admin-user
    passwordKey: admin-password  # pragma: allowlist secret
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Alertmanager is intentionally disabled per ADR-010 — workload
# PrometheusRules (shipped with the llm-gateway chart) fire to the
# Prometheus UI's /alerts endpoint only; no external paging. The
# homelab has no on-call rotation, so routing alerts anywhere would
# be operational theatre. Re-enable is one-line change here plus a
# receivers/route block under .config — see ADR-010 for the trigger
# conditions that should drive that change.
alertmanager:
  enabled: false

# k3s does not expose these control-plane endpoints by default
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
